controller_manager:
  ros__parameters:
    update_rate: 100

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    command_interfaces:
      - velocity

    state_interfaces:
      - position
      - velocity

    gains:
      joint1: {p: 2.0, d: 0.05, i: 0.0}
      joint2: {p: 2.0, d: 0.05, i: 0.0}
      joint3: {p: 2.0, d: 0.05, i: 0.0}
      joint4: {p: 2.0, d: 0.05, i: 0.0}
      joint5: {p: 2.0, d: 0.05, i: 0.0}
      joint6: {p: 2.0, d: 0.05, i: 0.0}
